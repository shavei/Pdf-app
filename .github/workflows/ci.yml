name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  # Lets you build the APK on demand from the GitHub mobile app:
  # Actions → CI → "Run workflow".
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Layer 1: Lint (static analysis)
      - name: ktlint + detekt + Android lint
        run: ./gradlew ktlintCheck detekt lintDebug --stacktrace

      # Layer 2: Unit tests, including the PDF-Test-Harness
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: PDF-Test-Harness (explicit)
        run: ./gradlew :file-persistence:testDebugUnitTest --tests "*PdfTestHarness*" --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

  instrumented:
    name: E2E (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # KVM is required for hardware-accelerated emulation on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Layer 3: device E2E — render + overlay + flatten/save on a real emulator.
      - name: Connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload androidTest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore

  # Publishes a one-tap-installable APK to a rolling "Latest build" GitHub
  # Release, but only after every check above passes (lint + unit + E2E), and
  # only for the main branch (push or the manual "Run workflow" button).
  publish:
    name: Publish latest APK
    needs: [ verify, instrumented ]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Stable asset name so the README "Download APK" link is a permalink:
      # https://github.com/<owner>/<repo>/releases/latest/download/pdf-app.apk
      - name: Stage APK with stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk pdf-app.apk

      - name: Publish to "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatically built from the latest commit on `main`
            (`${{ github.sha }}`) after all checks passed.

            **[⬇️ Download pdf-app.apk](https://github.com/${{ github.repository }}/releases/latest/download/pdf-app.apk)** and sideload it on your device.
          files: pdf-app.apk
          make_latest: true
