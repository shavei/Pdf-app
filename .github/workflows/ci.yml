name: CI

# One pipeline for everything:
#   - Branch pushes / PRs: lint + unit + debug build, plus emulator E2E.
#   - main: after all checks pass, a rolling "Latest build" APK is published.
#   - Tag `vX.Y.Z`: same checks, then a signed release build published as a
#     GitHub Release (gated on the verify job; E2E runs but does not block).
#   - Manual runs (workflow_dispatch, e.g. from the GitHub mobile app via
#     Actions → CI → "Run workflow") refresh the rolling build (main only)
#     and build the release artifacts without creating a Release.
on:
  # Feature branches are covered by `pull_request`, not here. Matching "**" as
  # well meant a push to a branch with an open PR fired both events, and the
  # concurrency group below cannot collapse them: `github.ref` is
  # `refs/heads/<branch>` for the push and `refs/pull/<n>/merge` for the PR, so
  # the two runs land in different groups and neither supersedes the other.
  # Every commit therefore ran the whole pipeline — emulator included — twice.
  # The trade is that a branch pushed without a PR now gets no CI until one is
  # opened, which matches how work reaches this repository.
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch/PR runs are cancelled; a tagged release build always
  # runs to completion.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nothing in this job consumes the output any more — the debug APK that
      # used to be named from it is gone. It stays as an early check: `publish`
      # and `release` both depend on this action resolving, and finding that
      # out on every pull request beats finding it out at merge or tag time.
      - name: Resolve app version
        id: version
        uses: ./.github/actions/app-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Layer 1: Lint (static analysis)
      - name: ktlint + detekt + Android lint
        run: ./gradlew ktlintCheck detekt lintDebug --stacktrace

      # Layer 2: Unit tests, including the PDF-Test-Harness
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: PDF-Test-Harness (explicit)
        run: ./gradlew :file-persistence:testDebugUnitTest --tests "*PdfTestHarness*" --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # No per-run debug APK. It was 26 MB against a 500 MB account-wide
      # Actions quota — this repository is private, so artifacts are billed —
      # and at the default 90-day retention roughly ten commits filled it. It
      # was also redundant: `publish` below puts an installable debug APK on
      # the rolling "Latest build" *release*, and release assets are not
      # Actions storage. A build off a specific PR is still reachable by
      # running that job manually (workflow_dispatch) or downloading from the
      # rolling release once the branch merges.

      # Only on failure, and only briefly: nobody opens a green run's reports,
      # and an unread 90-day copy of every run is what exhausted the quota.
      # Still archival, so a full quota must not fail an otherwise-green build
      # — real lint/unit/build failures fail the job at their own steps above.
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    name: E2E (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # KVM is required for hardware-accelerated emulation on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Layer 3: device E2E — render + overlay + flatten/save on a real emulator.
      - name: Connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      # As above: a passing emulator run's reports are never read, and these
      # are the only diagnostics when a device test fails, so they are worth
      # keeping for exactly as long as someone might look at them.
      - name: Upload androidTest reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore
          retention-days: 7

  # Publishes a one-tap-installable APK to a rolling "Latest build" GitHub
  # Release, but only after every check above passes (lint + unit + E2E), and
  # only for the main branch (push or the manual "Run workflow" button).
  publish:
    name: Publish latest APK
    needs: [ verify, instrumented ]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the commit count is the real build number.
          fetch-depth: 0

      # Stamps each rolling build so it is distinguishable from the previous one:
      # the build number is the commit count (monotonically increasing, so
      # Android offers an in-place update instead of refusing) and it is both the
      # versionCode and the human-readable suffix on the version name — App info
      # reads "1.4.1 (build 102)". The commit SHA stays in the release notes,
      # where it belongs, instead of masquerading as a version.
      - name: Resolve app version
        id: version
        uses: ./.github/actions/app-version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compute build stamp
        run: |
          {
            echo "SHORT_SHA=${GITHUB_SHA::7}"
            echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug \
            -PappBuildNumber="${{ steps.version.outputs.build_number }}" \
            --stacktrace

      # Stable asset name so the README "Download APK" link is a permalink:
      # https://github.com/<owner>/<repo>/releases/latest/download/Signet.apk
      # (the version is in the release title, the notes and Android's App info —
      # putting it in the filename too would break the permalink).
      - name: Stage APK with stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk Signet.apk

      # GitHub displays a release's original creation date forever — merely
      # swapping the asset kept showing "released weeks ago" for fresh builds.
      # Deleting the rolling release (and its tag) right before publishing
      # makes the next step create it anew, so the displayed date is always
      # the build date. The permalink above is tag-based and unaffected.
      - name: Delete previous "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish to "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build — ${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }})"
          body: |
            Built **${{ env.BUILD_DATE }}** from commit `${{ env.SHORT_SHA }}` on `main`
            after all checks passed. It installs as
            `${{ steps.version.outputs.version }} (build ${{ steps.version.outputs.build_number }})` —
            shown on Signet's home screen and in Android's App info.

            **[⬇️ Download Signet.apk](https://github.com/${{ github.repository }}/releases/latest/download/Signet.apk)** and sideload it on your device.
            New builds install directly over previous ones — no uninstall needed.
          files: Signet.apk
          make_latest: true

  release:
    name: Build + publish release
    # Only tag pushes and manual dispatches; verify must be green first. The
    # emulator E2E job runs alongside for coverage but does not gate a release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode = commit count, the same scheme the
          # rolling "Latest build" job uses, so a tagged release always
          # outranks any rolling build already installed on a device.
          fetch-depth: 0

      # gradle.properties stays the source of truth even for a tagged build; the
      # tag only has to agree with it. Tagging v1.4.1 while appVersionName still
      # says 1.3.0 fails here rather than shipping a mislabelled release.
      - name: Resolve app version
        id: version
        uses: ./.github/actions/app-version
        with:
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Decode the signing keystore from a secret, if configured. Without it the
      # build falls back to debug signing (installable, but not Play-ready).
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # No build-number suffix here: a release is its version, full stop.
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.build_number }}" \
            --stacktrace

      # Published under the app's name and version — Signet-1.4.1.apk /
      # Signet-1.4.1.aab — rather than AGP's generic app-release.*, so a
      # downloaded file is self-describing on the phone that installs it.
      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Signet-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Signet-$VERSION.aab"
          ls -la dist

      # Archival only — the release publish below reads dist/** from disk, so a
      # full Actions storage quota must not fail the release build.
      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/**
          if-no-files-found: error
          # Tag builds are rare and the Release itself is the durable copy, so
          # this is a short-lived convenience rather than an archive.
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true

      # The version climbs on its own: once v1.4.1 is published, main moves to
      # 1.4.2, so shipping the next release is just "tag v1.4.2" — no file to
      # edit, and the tag check above can never be the thing that stops a
      # release. To jump a minor or major instead, set appVersionName by hand on
      # main and tag that. A push authenticated with GITHUB_TOKEN does not
      # trigger workflows, so this cannot loop back into CI.
      - name: Bump the patch version on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASED: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$RELEASED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # A pre-release like 1.4.1-rc1 has no obvious "+1", and guessing one
            # would silently drop the suffix.
            echo "::warning::$RELEASED is not X.Y.Z, so there is no patch to bump. Set appVersionName on main by hand."
            exit 0
          fi
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          current="$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '[:space:]')"
          if [ "$current" != "$RELEASED" ]; then
            # Already moved on — a re-run of an old tag, or a hand-picked next
            # version. Either way, main knows better than this job does.
            echo "main is on $current, released $RELEASED. Nothing to bump."
            exit 0
          fi
          next="$(echo "$current" | awk -F. -v OFS=. '{ $NF += 1 } 1')"
          sed -i "s/^appVersionName=.*/appVersionName=$next/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "Bump version to $next after the $GITHUB_REF_NAME release"
          git push origin main
          echo "Released $RELEASED; main is now on $next."
