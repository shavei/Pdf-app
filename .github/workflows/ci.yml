name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Layer 1: Lint (static analysis)
      - name: ktlint + detekt + Android lint
        run: ./gradlew ktlintCheck detekt lintDebug --stacktrace

      # Layer 2: Unit tests, including the PDF-Test-Harness
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: PDF-Test-Harness (explicit)
        run: ./gradlew :file-persistence:testDebugUnitTest --tests "*PdfTestHarness*" --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore
