name: CI

# One pipeline for everything:
#   - Branch pushes / PRs: lint + unit + debug build, plus emulator E2E.
#   - main: after all checks pass, a rolling "Latest build" APK is published.
#   - Tag `vX.Y.Z`: same checks, then a signed release build published as a
#     GitHub Release (gated on the verify job; E2E runs but does not block).
#   - Manual runs (workflow_dispatch, e.g. from the GitHub mobile app via
#     Actions → CI → "Run workflow") refresh the rolling build (main only)
#     and build the release artifacts without creating a Release.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded branch/PR runs are cancelled; a tagged release build always
  # runs to completion.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Lint + Unit + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Layer 1: Lint (static analysis)
      - name: ktlint + detekt + Android lint
        run: ./gradlew ktlintCheck detekt lintDebug --stacktrace

      # Layer 2: Unit tests, including the PDF-Test-Harness
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: PDF-Test-Harness (explicit)
        run: ./gradlew :file-persistence:testDebugUnitTest --tests "*PdfTestHarness*" --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Artifact uploads are archival: a full Actions storage quota must not
      # fail an otherwise-green build. Real lint/unit/build failures still fail
      # the job at their own steps above.
      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

  instrumented:
    name: E2E (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # KVM is required for hardware-accelerated emulation on the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Layer 3: device E2E — render + overlay + flatten/save on a real emulator.
      - name: Connected Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload androidTest reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: "**/build/reports/androidTests/**"
          if-no-files-found: ignore

  # Publishes a one-tap-installable APK to a rolling "Latest build" GitHub
  # Release, but only after every check above passes (lint + unit + E2E), and
  # only for the main branch (push or the manual "Run workflow" button).
  publish:
    name: Publish latest APK
    needs: [ verify, instrumented ]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commit count can serve as the versionCode below.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Stamp each rolling build so it is distinguishable from the previous
      # one: versionCode = commit count (monotonically increasing, so Android
      # offers an in-place update instead of refusing), versionName carries the
      # short commit SHA (visible in Android's App info), and the release title
      # carries the build date.
      - name: Compute build stamp
        run: |
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: |
          ./gradlew assembleDebug \
            -PappVersionCode="$VERSION_CODE" \
            -PappVersionName="0.1.0+$SHORT_SHA" \
            --stacktrace

      # Stable asset name so the README "Download APK" link is a permalink:
      # https://github.com/<owner>/<repo>/releases/latest/download/pdf-app.apk
      - name: Stage APK with stable name
        run: cp app/build/outputs/apk/debug/app-debug.apk pdf-app.apk

      # GitHub displays a release's original creation date forever — merely
      # swapping the asset kept showing "released weeks ago" for fresh builds.
      # Deleting the rolling release (and its tag) right before publishing
      # makes the next step create it anew, so the displayed date is always
      # the build date. The permalink above is tag-based and unaffected.
      - name: Delete previous "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Publish to "Latest build" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build — ${{ env.BUILD_DATE }}"
          body: |
            Built **${{ env.BUILD_DATE }}** from commit `${{ env.SHORT_SHA }}` on `main`
            after all checks passed. Installed version shows as
            `0.1.0+${{ env.SHORT_SHA }}` (versionCode ${{ env.VERSION_CODE }})
            in Android's App info.

            **[⬇️ Download pdf-app.apk](https://github.com/${{ github.repository }}/releases/latest/download/pdf-app.apk)** and sideload it on your device.
            New builds install directly over previous ones — no uninstall needed.
          files: pdf-app.apk
          make_latest: true

  release:
    name: Build + publish release
    # Only tag pushes and manual dispatches; verify must be green first. The
    # emulator E2E job runs alongside for coverage but does not gate a release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: versionCode = commit count, the same scheme the
          # rolling "Latest build" job uses, so a tagged release always
          # outranks any rolling build already installed on a device.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # Decode the signing keystore from a secret, if configured. Without it the
      # build falls back to debug signing (installable, but not Play-ready).
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.1.0"
          fi
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="$(git rev-list --count HEAD)" \
            --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/ 2>/dev/null || true
          cp app/build/outputs/bundle/release/*.aab dist/ 2>/dev/null || true
          ls -la dist

      # Archival only — the release publish below reads dist/** from disk, so a
      # full Actions storage quota must not fail the release build.
      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/**
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
