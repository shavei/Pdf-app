org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The version under development — the one the next `vX.Y.Z` tag must carry, and
# the one local builds and the rolling "Latest build" from main are stamped with.
# Bump the patch (1.4.1 -> 1.4.2) right after tagging a release, so builds never
# claim a version that already shipped; bump the minor or major by hand when a
# release deserves it. CI appends a build number: "1.4.1 (build 102)".
appVersionName=1.4.1
