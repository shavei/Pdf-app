org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Marketing version for every build that is not cut from a `vX.Y.Z` tag: local
# builds and the rolling "Latest build" from main. A tagged release overrides it
# with the tag, so this is the *next* version — bump it right after tagging a
# release, so builds never claim a version that already shipped. CI appends a
# build number: "1.4.0 (build 102)".
appVersionName=1.4.0
