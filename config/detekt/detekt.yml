# Detekt configuration for PDF-app. Builds upon the default config
# (buildUponDefaultConfig = true), with a few project-specific tweaks.

complexity:
  # @Composable functions conventionally have many parameters, are long, and
  # branch on state — none of which are smells in Compose UI code.
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    # @Composable functions are PascalCase by Compose convention.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
